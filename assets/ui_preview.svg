<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Frame -->
  <rect width="800" height="500" rx="10" ry="10" fill="#1e293b" />

  <!-- Title Bar -->
  <rect width="800" height="40" rx="10" ry="10" fill="#0f172a" />
  <rect y="20" width="800" height="20" fill="#0f172a" /> <!-- Square off bottom corners of title bar -->
  <circle cx="20" cy="20" r="6" fill="#ef4444" />
  <circle cx="45" cy="20" r="6" fill="#f59e0b" />
  <circle cx="70" cy="20" r="6" fill="#22c55e" />
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Zeta Trading Bot - MVP</text>

  <!-- Content Area -->

  <!-- Tab Bar -->
  <rect x="0" y="40" width="800" height="30" fill="#334155" />
  <rect x="0" y="40" width="120" height="30" fill="#1e293b" />
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Live Control</text>
  <text x="160" y="60" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Logs</text>

  <!-- Main Controls -->
  <rect x="50" y="100" width="150" height="40" rx="5" fill="#22c55e" />
  <text x="125" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">START ENGINE</text>

  <rect x="220" y="100" width="150" height="40" rx="5" fill="#475569" />
  <text x="295" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">STOP ENGINE</text>

  <!-- Status Panel -->
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">Engine Status:</text>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22c55e">RUNNING</text>

  <!-- Logs Area -->
  <rect x="50" y="220" width="700" height="250" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="60" y="245" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">2023-10-27 10:00:01 - INFO - Trading engine started.</text>
  <text x="60" y="265" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">2023-10-27 10:00:02 - INFO - Connected to MT5 account 12345678.</text>
  <text x="60" y="285" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">2023-10-27 10:00:02 - INFO - Loaded strategy: MovingAverageCrossover.</text>
  <text x="60" y="305" font-family="Consolas, monospace" font-size="12" fill="#22c55e">2023-10-27 10:15:00 - INFO - BUY signal for EURUSD.</text>
  <text x="60" y="325" font-family="Consolas, monospace" font-size="12" fill="#22c55e">2023-10-27 10:15:01 - INFO - Order placed: Ticket #998877.</text>
</svg>
